# Phase 1: database only. The backend and MCP server services are added in phase 11.
#
#   docker compose up -d db
#
# The image is PostgreSQL 16 with the pgvector extension pre-installed
# (needed for RAG in phase 4).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankai}
      POSTGRES_DB: ${POSTGRES_DB:-bankai}
    ports:
      # Change POSTGRES_PORT if a local PostgreSQL already uses 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankai} -d ${POSTGRES_DB:-bankai}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
